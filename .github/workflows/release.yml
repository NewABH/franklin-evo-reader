name: Publish release 2.3.2

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v2.3.2
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_COMMIT: 8972632736f63465bb4af2b7d0ec8d4318fbff65
    steps:
      # Публикуем проверенный EXE из конкретного коммита, без пересборки.
      - name: Download and verify executable
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/$GH_REPO/$SOURCE_COMMIT/downloads"
          curl --fail --location --retry 3 "$base/FranklinEvoReader.exe" -o FranklinEvoReader.exe
          curl --fail --location --retry 3 "$base/SHA256SUMS.txt" -o SHA256SUMS.txt
          echo "CA1C520633DA3785F8E41608838B47903E768A4F4B907EB0E163821B3D499E58  FranklinEvoReader.exe" | sha256sum --check
          sha256sum --check SHA256SUMS.txt
      - name: Publish release with executable
        shell: bash
        run: |
          set -euo pipefail
          # Повторный запуск не заменяет уже опубликованные файлы.
          if gh release view v2.3.2 >/dev/null 2>&1; then
            echo "Release v2.3.2 already exists."
            exit 0
          fi
          cat > notes.md <<'NOTES'
          Консольная программа для Windows x64. Установка Python и .NET не требуется.

          - Чтение данных уровнемера Franklin Fueling EVO через TCP, отчёт i214.
          - Получение всех резервуаров либо выбранного резервуара и параметров.
          - Плотность округляется до целого без масштабирования.
          - Уровень, температура, объём и масса округляются до двух знаков.
          - Вывод и сообщения об ошибках используют UTF-8; ошибки сокета содержат числовой код.

          Скачайте FranklinEvoReader.exe. Файл SHA256SUMS.txt содержит контрольную сумму.
          Инструкция по запуску: [README](https://github.com/NewABH/franklin-evo-reader/blob/8972632736f63465bb4af2b7d0ec8d4318fbff65/README.md).
          NOTES
          gh release create v2.3.2 FranklinEvoReader.exe SHA256SUMS.txt --target "$SOURCE_COMMIT" --title "Franklin EVO Reader 2.3.2" --notes-file notes.md --latest
